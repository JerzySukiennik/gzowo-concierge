<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge Live Test</title>
<style>
:root { color-scheme: dark light; }
body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 24px 18px; background: #0b0b0c; color: #f2f2f3; }
@media (prefers-color-scheme: light) { body { background: #fafafa; color: #111; } }
h1 { font-size: 20px; margin: 0 0 16px; }
.row { display: flex; gap: 10px; margin-bottom: 18px; }
button { flex: 1; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid #3a3a40; background: transparent; color: inherit; cursor: pointer; }
button.go { background: #f2f2f3; color: #0b0b0c; border-color: #f2f2f3; }
#state { font-weight: 600; margin-bottom: 10px; }
.bar { height: 8px; border-radius: 4px; background: #26262a; margin-bottom: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #f2f2f3; transition: width .05s linear; }
.lbl { font-size: 12px; color: #8e8e95; margin-bottom: 3px; }
#log { white-space: pre-wrap; font-size: 14px; border-top: 1px solid #26262a; padding-top: 14px; min-height: 160px; }
.u { color: #8e8e95; } .e { color: #ff453a; } .t { color: #8e8e95; font-size: 13px; }
</style>
</head>
<body>
<h1>Concierge Live Test</h1>
<div class="row"><button class="go" id="start">Start</button><button id="mute">Wycisz mikrofon</button><button id="stop">Stop</button></div>
<div id="state">idle</div>
<div class="lbl">mikrofon</div><div class="bar"><i id="mic"></i></div>
<div class="lbl">asystent</div><div class="bar"><i id="out"></i></div>
<div id="log"></div>
<script type="module">
import { createLive } from './live-audio.js';
const $ = id => document.getElementById(id);
const log = $('log');
let muted = false, cur = null;
function line(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); return d; }
const live = createLive({
  onState: s => { $('state').textContent = s; },
  onLevel: l => { $('mic').style.width = (l.mic * 100) + '%'; $('out').style.width = (l.out * 100) + '%'; },
  onTranscript: t => { if (!cur || cur.role !== t.role) cur = { role: t.role, el: line(t.role === 'user' ? 'u' : '', '') }; cur.el.textContent = (t.role === 'user' ? 'Ty: ' : 'Concierge: ') + t.text; if (t.final) cur = null; },
  onEvent: e => { if (e.type === 'tool') line('t', (e.status === 'running' ? '… ' : e.status === 'done' ? '✓ ' : '✕ ') + e.summary); else if (e.type === 'approval') line('t', 'Czeka na zatwierdzenie: ' + e.summary); else if (e.type === 'error') line('e', e.message); },
});
$('start').onclick = () => live.start();
$('stop').onclick = () => live.stop();
$('mute').onclick = () => { muted = !muted; live.mute(muted); $('mute').textContent = muted ? 'Włącz mikrofon' : 'Wycisz mikrofon'; };
</script>
</body>
</html>
