<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Concierge">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest" id="manifest">
<link rel="stylesheet" href="style.css">
<title>Gzowo Concierge</title>
</head>
<body>
<div id="app" data-state="idle" data-busy="0">
  <header class="bar">
    <div class="brand">
      <svg class="orb" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="o-ring" cx="16" cy="16" r="13"/><circle class="o-arc" cx="16" cy="16" r="13" pathLength="100"/><circle class="o-core" cx="16" cy="16" r="7"/></svg>
      <h1>Concierge</h1>
    </div>
    <button class="icon-btn" id="gear" type="button" aria-label="Ustawienia" aria-haspopup="dialog" aria-expanded="false"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg></button>
  </header>

  <div id="banner" role="status"><svg class="orb mini" viewBox="0 0 32 32" aria-hidden="true"><circle class="o-ring" cx="16" cy="16" r="13"/></svg><span></span></div>

  <main id="log" role="log" aria-label="Rozmowa" tabindex="-1"><div id="thread"></div></main>
  <div class="fade-top" aria-hidden="true"></div>

  <div id="dock">
    <div id="dockInner">
      <button id="jump" type="button" aria-label="Przewiń na dół"></button>
      <div id="pending" aria-live="assertive"></div>
      <form id="form" class="composer">
        <textarea id="input" rows="1" placeholder="Napisz do Concierge" aria-label="Wiadomość" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
        <button id="send" type="submit" aria-label="Wyślij" data-mode="send" disabled><svg class="ic ic-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5.5M6 11.5l6-6 6 6"/></svg><svg class="ic ic-face" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.8" y="6.6" width="2.6" height="6" rx="1.3"/><rect x="14.6" y="6.6" width="2.6" height="6" rx="1.3"/><path d="M9.6 17h4.8"/></svg></button>
      </form>
    </div>
  </div>
</div>

<div id="scrim"></div>
<aside id="sheet" role="dialog" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Ustawienia</h2>
    <button class="icon-btn" id="sheetClose" type="button" aria-label="Zamknij"></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div id="toast" role="status"></div>
</aside>

<section id="live" role="dialog" aria-modal="true" aria-labelledby="liveTitle" tabindex="-1" inert>
  <div class="live-scrim"></div>
  <div class="live-panel">
    <div class="live-bar">
      <h2 id="liveTitle">Rozmowa na żywo</h2>
      <button class="icon-btn" id="liveCloseTop" type="button" aria-label="Zamknij"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="live-face"><canvas id="faceCanvas" aria-hidden="true"></canvas></div>
    <div class="live-status"><p id="liveStatus" role="status"></p><p id="liveHint"></p></div>
    <div class="live-tx" aria-live="polite"><p id="txUser"></p><p id="txBot"></p></div>
    <div class="live-cards"><p class="cards-empty">Tu zobaczysz, co robię, i prośby o zgodę.</p><div id="liveSteps"></div><div id="livePending" aria-live="assertive"></div></div>
    <div class="live-ctrl">
      <button class="ctl" id="liveMute" type="button" aria-pressed="false" aria-label="Wycisz mikrofon"><span class="ball"><span class="glyph"></span></span><span class="lbl">Wycisz</span></button>
      <button class="ctl mic" id="liveMic" type="button" aria-label="Zacznij rozmowę"><span class="ball"><span class="ring"></span><span class="glyph"></span></span><span class="lbl">Zacznij</span></button>
      <button class="ctl" id="liveClose" type="button" aria-label="Zamknij rozmowę na żywo"><span class="ball"><span class="glyph"></span></span><span class="lbl">Zamknij</span></button>
    </div>
  </div>
</section>

<section id="pair" role="dialog" aria-labelledby="pairTitle">
  <div class="pair-card">
    <svg class="orb big" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="o-ring" cx="16" cy="16" r="13"/><circle class="o-arc" cx="16" cy="16" r="13" pathLength="100"/><circle class="o-core" cx="16" cy="16" r="7"/></svg>
    <h2 id="pairTitle">Połącz z Concierge</h2>
    <p>Na Macu otwórz Concierge, wejdź w ustawienia i zeskanuj kod aparatem iPhone'a. Albo wklej tu link do połączenia.</p>
    <div class="field">
      <input id="pairInput" type="text" inputmode="url" placeholder="Link do połączenia" aria-label="Link do połączenia" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="pairErr">
      <button type="button" id="pairPaste" class="pill"></button>
    </div>
    <button class="btn ink wide" id="pairGo" type="button">Połącz</button>
    <p class="err" id="pairErr" role="alert"></p>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
